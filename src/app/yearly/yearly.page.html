<ion-content class="analysis2-content">
  <div class="main-content">

    <!-- GREEN TOP SECTION -->
    <div class="top-section">

      <!-- Navbar -->
      <div class="navbar-row">
        <div class="nav-btn nav-btn--back">
          <ion-icon name="chevron-back-outline"></ion-icon>
        </div>
        <div class="nav-title">Analysis</div>
        <div class="nav-btn nav-btn--bell">
          <ion-icon name="notifications-outline"></ion-icon>
        </div>
      </div>

      <!-- Stats Row -->
      <div class="stats-row">
        <div class="stat-item">
          <ion-icon name="arrow-up-outline" class="stat-icon"></ion-icon>
          <div class="stat-info">
            <div class="stat-label">Total Balance</div>
            <div class="stat-amount">$7,783.00</div>
          </div>
        </div>
        <div class="stats-divider"></div>
        <div class="stat-item">
          <ion-icon name="arrow-down-outline" class="stat-icon"></ion-icon>
          <div class="stat-info">
            <div class="stat-label">Total Expense</div>
            <div class="stat-amount stat-amount--dark">-$1,187.40</div>
          </div>
        </div>
      </div>

      <!-- Progress Bar -->
      <div class="progress-wrap">
        <div class="progress-bar-outer">
          <span class="progress-label">30%</span>
          <div class="progress-bar-inner">
            <span class="progress-amount">$20,000.00</span>
          </div>
        </div>
      </div>

      <!-- Checkbox Note -->
      <div class="note-row">
        <ion-icon name="checkbox-outline" class="note-icon"></ion-icon>
        <span class="note-text">30% Of Your Expenses, Looks Good.</span>
      </div>

    </div>
    <!-- END GREEN SECTION -->

    <!-- WHITE SECTION -->
    <div class="white-section">

      <!-- Tab Bar -->
      <div class="tab-bar">
        <div class="tab-item"    (click)="goTodaily()"   >Daily</div>
        <div class="tab-item"     (click)="goToweekly()">Weekly</div>
        <div class="tab-item"    (click)="goTomonthly()">Monthly</div>
        <div class="tab-item  tab-item--active">Year</div>
      </div>

      <!-- Income & Expenses Card -->
      <div class="expenses-card">
        <div class="expenses-header">
          <span class="expenses-title">Income & Expenses</span>
          <div class="expenses-actions">
            <div class="action-btn">
              <ion-icon name="search-outline"></ion-icon>
            </div>
            <div class="action-btn">
              <ion-icon name="calendar-outline"></ion-icon>
            </div>
          </div>
        </div>

        <!-- Chart -->
        <div class="chart-wrap">
          <div class="chart-inner">

            <div class="y-row">
              <span class="y-label">15k</span>
              <div class="y-line"></div>
            </div>
            <div class="y-row">
              <span class="y-label">10k</span>
              <div class="y-line"></div>
            </div>
            <div class="y-row">
              <span class="y-label">5k</span>
              <div class="y-line"></div>
            </div>
            <div class="y-row">
              <span class="y-label">1k</span>
              <div class="y-line"></div>
            </div>

            <div class="bars-row">

              <div class="bar-group">
                <div class="bar-pair">
                  <div class="bar bar--blue" style="height: 35px"></div>
                  <div class="bar bar--green" style="height: 20px"></div>
                </div>
                <span class="bar-label">Mon</span>
              </div>

              <div class="bar-group">
                <div class="bar-pair">
                  <div class="bar bar--blue" style="height: 55px"></div>
                  <div class="bar bar--green" style="height: 25px"></div>
                </div>
                <span class="bar-label">Tue</span>
              </div>

              <div class="bar-group">
                <div class="bar-pair">
                  <div class="bar bar--blue" style="height: 45px"></div>
                  <div class="bar bar--green" style="height: 30px"></div>
                </div>
                <span class="bar-label">Wed</span>
              </div>

              <div class="bar-group">
                <div class="bar-pair">
                  <div class="bar bar--blue" style="height: 70px"></div>
                  <div class="bar bar--green" style="height: 35px"></div>
                </div>
                <span class="bar-label">Thu</span>
              </div>

              <div class="bar-group">
                <div class="bar-pair">
                  <div class="bar bar--blue" style="height: 90px"></div>
                  <div class="bar bar--green" style="height: 40px"></div>
                </div>
                <span class="bar-label">Fri</span>
              </div>

              <div class="bar-group">
                <div class="bar-pair">
                  <div class="bar bar--blue" style="height: 50px"></div>
                  <div class="bar bar--green" style="height: 60px"></div>
                </div>
                <span class="bar-label">Sat</span>
              </div>

              <div class="bar-group">
                <div class="bar-pair">
                  <div class="bar bar--blue" style="height: 30px"></div>
                  <div class="bar bar--green" style="height: 45px"></div>
                </div>
                <span class="bar-label">Sun</span>
              </div>

            </div>
          </div>
        </div>

      </div>

      <!-- Income / Expense Cards -->
      <div class="ie-row">

        <div class="ie-card">
          <div class="ie-icon-wrap ie-icon-wrap--teal">
            <ion-icon name="arrow-up-outline"></ion-icon>
          </div>
          <div class="ie-label">Income</div>
          <div class="ie-amount">$4,120.00</div>
        </div>

        <div class="ie-card">
          <div class="ie-icon-wrap ie-icon-wrap--blue">
            <ion-icon name="arrow-down-outline"></ion-icon>
          </div>
          <div class="ie-label">Expense</div>
          <div class="ie-amount">$1,187.40</div>
        </div>

      </div>

      <!-- My Targets -->
      <div class="section-label">My Targets</div>

    </div>
    <!-- END WHITE SECTION -->

  </div>
</ion-content>






<ion-footer class="floating-footer">
  <div class="nav-item nav-item--active">
 
   <ion-icon name="home-outline"(click)="goTobottomnavigation()" ></ion-icon>
    </div>

  <div class="nav-item   nav-item--active">
     <div class="nav-active-bg">
    <ion-icon name="search-outline"></ion-icon>
  </div>
  </div>
  <div class="nav-item">
    <ion-icon name="swap-horizontal-outline" (click)="goTotransaction()"></ion-icon>
  </div>
  <div class="nav-item">
    <ion-icon name="layers-outline"(click)="goTocategories()" ></ion-icon>
  </div>
  <div class="nav-item">
    <ion-icon name="person-outline"     (click)="goToprofile()" ></ion-icon>
  </div>
</ion-footer>
