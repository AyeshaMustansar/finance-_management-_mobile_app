<ion-content class="profile-content">
  <div class="main-content">

    <!-- ===== GREEN TOP SECTION ===== -->
    <div class="top-section">

      <!-- Navbar -->
      <div class="navbar-row">
        <div class="nav-btn nav-btn--back">
          <ion-icon name="chevron-back-outline"></ion-icon>
        </div>
        <div class="nav-title">Profile</div>
        <div class="nav-btn-placeholder"></div>
      </div>

    </div>
    <!-- END GREEN SECTION -->

    <!-- ===== WHITE SECTION ===== -->
    <div class="white-section">

      <!-- Avatar sits on the green/white border -->
      <div class="avatar-wrap">
        <div class="avatar-ring">
          <img class="avatar-img" src="../../assets/images.jpg" alt="Profile Photo" />
        </div>
        <div class="avatar-name">John Smith</div>
        <div class="avatar-date">@ 2023/01/21</div>
      </div>

      <!-- Edit Profile -->
      <div class="menu-item">
        <div class="menu-icon-wrap teal">
          <ion-icon name="person-outline"></ion-icon>
        </div>
        <span class="menu-label">Edit Profile</span>
        <ion-icon name="chevron-forward-outline" class="menu-arrow"></ion-icon>
      </div>

      <!-- Security -->
      <div class="menu-item">
        <div class="menu-icon-wrap teal">
          <ion-icon name="shield-checkmark-outline"></ion-icon>
        </div>
        <span class="menu-label">Security</span>
        <ion-icon name="chevron-forward-outline" class="menu-arrow"></ion-icon>
      </div>

      <!-- Setting -->
      <div class="menu-item">
        <div class="menu-icon-wrap teal">
          <ion-icon name="settings-outline"></ion-icon>
        </div>
        <span class="menu-label">Setting</span>
        <ion-icon name="chevron-forward-outline" class="menu-arrow"></ion-icon>
      </div>

      <!-- Help -->
      <div class="menu-item">
        <div class="menu-icon-wrap teal">
          <ion-icon name="help-circle-outline"></ion-icon>
        </div>
        <span class="menu-label">Help</span>
        <ion-icon name="chevron-forward-outline" class="menu-arrow"></ion-icon>
      </div>

      <!-- Logout -->
      <div class="menu-item">
        <div class="menu-icon-wrap teal">
          <ion-icon name="log-out-outline"></ion-icon>
        </div>
        <span class="menu-label">Logout</span>
        <ion-icon name="chevron-forward-outline" class="menu-arrow"></ion-icon>
      </div>

    </div>
    <!-- END WHITE SECTION -->

  </div>
  
</ion-content>

<ion-footer class="floating-footer">
  <div class="nav-item">
    <ion-icon name="home-outline"></ion-icon>
  </div>
  <div class="nav-item">
    <ion-icon name="search-outline"></ion-icon>
  </div>
  <div class="nav-item">
    <ion-icon name="swap-horizontal-outline"></ion-icon>
  </div>
 
    <div class="nav-item">
      <ion-icon name="layers-outline"></ion-icon>
   
  </div>

   <div class="nav-active-bg">
  <div class="nav-item nav-item--active">

    <ion-icon name="person-outline"></ion-icon>
  </div>
  </div>
</ion-footer>
