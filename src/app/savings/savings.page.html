<ion-content class="savings-content">
  <div class="main-content">

    <!-- GREEN TOP SECTION -->
    <div class="top-section">
      <div class="navbar-row">
        <div class="nav-btn nav-btn--back">
          <ion-icon name="chevron-back-outline"></ion-icon>
        </div>
        <div class="nav-title">Savings</div>
        <div class="nav-btn nav-btn--bell">
          <ion-icon name="notifications-outline"></ion-icon>
        </div>
      </div>

      <!-- Stats Row -->
      <div class="stats-row">
        <div class="stat-item">
          <ion-icon name="arrow-up-outline" class="stat-icon"></ion-icon>
          <div class="stat-info">
            <div class="stat-label">Total Balance</div>
            <div class="stat-amount">$7,783.00</div>
          </div>
        </div>
        <div class="stats-divider"></div>
        <div class="stat-item">
          <ion-icon name="arrow-down-outline" class="stat-icon"></ion-icon>
          <div class="stat-info">
            <div class="stat-label">Total Expense</div>
            <div class="stat-amount stat-amount--dark">-$1,187.40</div>
          </div>
        </div>
      </div>

      <!-- Progress Bar -->
      <div class="progress-wrap">
        <div class="progress-bar-outer">
          <span class="progress-label">30%</span>
          <div class="progress-bar-inner">
            <span class="progress-amount">$20,000.00</span>
          </div>
        </div>
      </div>

      <!-- Note -->
      <div class="note-row">
        <ion-icon name="checkbox-outline" class="note-icon"></ion-icon>
        <span class="note-text">30% Of Your Expenses, Looks Good.</span>
      </div>
    </div>

    <!-- WHITE SECTION -->
    <div class="white-section">

      <div class="savings-grid">

        <!-- Travel (active - dark blue) -->
        <div class="savings-card">
          <div class="savings-icon-wrap savings-icon-wrap--active">
            <ion-icon name="airplane-outline"></ion-icon>
          </div>
          <div class="savings-label">Travel</div>
        </div>

        <!-- New House -->
        <div class="savings-card">
          <div class="savings-icon-wrap">
            <ion-icon name="home-outline"></ion-icon>
          </div>
          <div class="savings-label">New House</div>
        </div>

        <!-- Car -->
        <div class="savings-card">
          <div class="savings-icon-wrap">
            <ion-icon name="car-outline"></ion-icon>
          </div>
          <div class="savings-label">Car</div>
        </div>

        <!-- Wedding -->
        <div class="savings-card">
          <div class="savings-icon-wrap">
            <ion-icon name="heart-outline"></ion-icon>
          </div>
          <div class="savings-label">Wedding</div>
        </div>

      </div>

      <!-- Add More Button -->
      <div class="add-btn">Add More</div>

    </div>

  </div>
</ion-content>






<ion-footer class="floating-footer">
  <div class="nav-item nav-item--active">
   
      <ion-icon name="home-outline"></ion-icon>
  
  </div>
  <div class="nav-item">
    <ion-icon name="search-outline"></ion-icon>
  </div>

  <div class="nav-item">
    <ion-icon name="swap-horizontal-outline"></ion-icon>
 
  </div>
     <div class="nav-active-bg">
  <div class="nav-item">
    <ion-icon name="layers-outline"></ion-icon>
  </div>
  </div>
  <div class="nav-item">
    <ion-icon name="person-outline"></ion-icon>
  </div>
</ion-footer>
