<ion-content [fullscreen]="true" [scrollY]="false" class="new-password-content">

  <!-- Green Top Section -->
  <div class="green-top">
    <h1 class="page-title">New Password</h1>
  </div>

  <!-- White Bottom Sheet -->
  <div class="white-sheet">

    <div class="center-wrapper">

      <!-- New Password -->
      <div class="input-group">
        <label class="input-label">New Password</label>
        <div class="input-wrapper">
          <ion-input type="password" placeholder="••••••••••" class="custom-input"></ion-input>
          <button class="eye-btn" type="button">
            <ion-icon name="eye-outline"></ion-icon>
          </button>
        </div>
      </div>

      <!-- Confirm New Password -->
      <div class="input-group">
        <label class="input-label">Confirm New Password</label>
        <div class="input-wrapper">
          <ion-input type="password" placeholder="••••••••••" class="custom-input"></ion-input>
          <button class="eye-btn" type="button">
            <ion-icon name="eye-outline"></ion-icon>
          </button>
        </div>
      </div>

      <!-- Spacer -->
      <div class="spacer"></div>

      <!-- Change Password Button -->
      <button class="change-btn" type="button" (click)="goTopaswordchangesuccessfully()">Change Password</button>

    </div>
  </div>

</ion-content>
