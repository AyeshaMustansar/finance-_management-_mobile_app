<ion-content class="contact-us-content">
  <div class="main-content">

    <!-- ===== GREEN TOP SECTION ===== -->
    <div class="top-section">
      <div class="navbar-row">
        <div class="nav-btn nav-btn--back">
          <ion-icon name="chevron-back-outline"></ion-icon>
        </div>
        <div class="nav-title">Help & FAQS</div>
        <div class="nav-btn nav-btn--bell">
          <ion-icon name="notifications-outline"></ion-icon>
        </div>
      </div>
    </div>

    <!-- ===== WHITE SECTION ===== -->
    <div class="white-section">

      <!-- Question Heading -->
      <div class="help-heading">How Can We Help You?</div>

      <!-- FAQ / Contact Us Toggle -->
      <div class="tab-row">
        <button type="button" class="tab-btn">FAQ</button>
        <button type="button" class="tab-btn tab-btn--active">Contact Us</button>
      </div>

      <!-- Category Tabs -->
      <div class="category-row">
        <button type="button" class="cat-btn cat-btn--active">General</button>
        <button type="button" class="cat-btn">Account</button>
        <button type="button" class="cat-btn">Services</button>
      </div>

      <!-- Search Bar -->
      <div class="search-bar-wrap">
        <ion-icon name="search-outline" class="search-icon"></ion-icon>
        <input type="text" class="search-input" placeholder="Search" />
      </div>

      <!-- Contact List -->
      <div class="contact-list">

        <div class="contact-item">
          <div class="contact-icon-wrap">
            <ion-icon name="headset-outline"></ion-icon>
          </div>
          <span class="contact-label">Customer Service</span>
          <ion-icon name="chevron-forward-outline" class="contact-arrow"></ion-icon>
        </div>

        <div class="contact-item">
          <div class="contact-icon-wrap">
            <ion-icon name="globe-outline"></ion-icon>
          </div>
          <span class="contact-label">Website</span>
          <ion-icon name="chevron-forward-outline" class="contact-arrow"></ion-icon>
        </div>

        <div class="contact-item">
          <div class="contact-icon-wrap">
            <ion-icon name="logo-facebook"></ion-icon>
          </div>
          <span class="contact-label">Facebook</span>
          <ion-icon name="chevron-forward-outline" class="contact-arrow"></ion-icon>
        </div>

        <div class="contact-item">
          <div class="contact-icon-wrap">
            <ion-icon name="logo-whatsapp"></ion-icon>
          </div>
          <span class="contact-label">Whatsapp</span>
          <ion-icon name="chevron-forward-outline" class="contact-arrow"></ion-icon>
        </div>

        <div class="contact-item">
          <div class="contact-icon-wrap">
            <ion-icon name="logo-instagram"></ion-icon>
          </div>
          <span class="contact-label">Instagram</span>
          <ion-icon name="chevron-forward-outline" class="contact-arrow"></ion-icon>
        </div>

      </div>

    </div>

  </div>
</ion-content>

<ion-footer class="floating-footer">
  <div class="nav-item">
    <ion-icon name="home-outline"></ion-icon>
  </div>
  <div class="nav-item">
    <ion-icon name="search-outline"></ion-icon>
  </div>
  <div class="nav-item">
    <ion-icon name="swap-horizontal-outline"></ion-icon>
  </div>
  <div class="nav-item">
    <ion-icon name="layers-outline"></ion-icon>
  </div>
  <div class="nav-active-bg">
    <div class="nav-item">
      <ion-icon name="person-outline"></ion-icon>
    </div>
  </div>
</ion-footer>
