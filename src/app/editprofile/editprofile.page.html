<ion-content class="edit-profile-content">
  <div class="main-content">

    <!-- ===== GREEN TOP SECTION ===== -->
    <div class="top-section">

      <!-- Navbar -->
      <div class="navbar-row">
        <div class="nav-btn nav-btn--back">
          <ion-icon name="chevron-back-outline"    (click)="goToprofile()" ></ion-icon>
        </div>
        <div class="nav-title">Edit My Profile</div>
        <div class="nav-btn nav-btn--bell"  (click)="goTonotification()" >
          <ion-icon name="notifications-outline"  (click)="goTonotification()"></ion-icon>
        </div>
      </div>

    </div>
    <!-- END GREEN SECTION -->

    <!-- ===== WHITE SECTION ===== -->
    <div class="white-section">

      <!-- Avatar on border -->
      <div class="avatar-wrap">
        <div class="avatar-ring">
          <img class="avatar-img" src="../../assets/images.jpg" alt="Profile Photo" />
        </div>
        <div class="avatar-name">John Smith</div>
        <div class="avatar-date">@ 2023/01/21</div>
      </div>

      <!-- Account Settings Label -->
      <div class="section-label">Account Settings</div>

      <!-- Username -->
      <div class="field-group">
        <div class="field-label">Username</div>
        <div class="field-input-wrap">
          <input type="text" class="field-input" placeholder="John Smith" />
        </div>
      </div>

      <!-- Phone -->
      <div class="field-group">
        <div class="field-label">Phone</div>
        <div class="field-input-wrap">
          <input type="tel" class="field-input" placeholder="+94 (56) 990.90" />
        </div>
      </div>

      <!-- Email Address -->
      <div class="field-group">
        <div class="field-label">Email Address</div>
        <div class="field-input-wrap">
          <input type="email" class="field-input" placeholder="jhon@gmail.com" />
        </div>
      </div>

      <!-- Toggle: Push Notifications -->
      <div class="toggle-item">
        <span class="toggle-label">Push Notifications</span>
        <label class="toggle-switch">
          <input type="checkbox" checked />
          <span class="toggle-slider"></span>
        </label>
      </div>

      <!-- Toggle: Turn Dark Theme -->
      <div class="toggle-item">
        <span class="toggle-label">Turn Dark Theme</span>
        <label class="toggle-switch">
          <input type="checkbox" />
          <span class="toggle-slider"></span>
        </label>
      </div>

      <!-- Save Button -->
      <div class="save-btn">Update Profile</div>

    </div>
    <!-- END WHITE SECTION -->

  </div>
</ion-content>



<ion-footer class="floating-footer">
  <div class="nav-item">
    <ion-icon    name="home-outline"
                                       (click)="goTobottomnavigation()">     </ion-icon>
  </div>
  <div class="nav-item">
    <ion-icon name="search-outline"               (click)="goTodaily()"            ></ion-icon>
  </div>
  <div class="nav-item">
    <ion-icon name="swap-horizontal-outline" (click)="goTotransaction()"  ></ion-icon>
  </div>

    <div class="nav-item">
      <ion-icon name="layers-outline"   (click)="goTocategories()"    ></ion-icon>

  </div>
    <div class="nav-active-bg">
  <div class="nav-item nav-item--active">
   
    <ion-icon name="person-outline"></ion-icon>
     </div>
  </div>
</ion-footer>
