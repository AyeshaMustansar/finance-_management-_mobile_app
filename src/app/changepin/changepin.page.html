<ion-content class="change-pin-content">
  <div class="main-content">

    <!-- ===== GREEN TOP SECTION ===== -->
    <div class="top-section">
      <div class="navbar-row">
        <div class="nav-btn nav-btn--back">
          <ion-icon name="chevron-back-outline"></ion-icon>
        </div>
        <div class="nav-title">Change Pin</div>
        <div class="nav-btn nav-btn--bell">
          <ion-icon name="notifications-outline"></ion-icon>
        </div>
      </div>
    </div>

    <!-- ===== WHITE SECTION ===== -->
    <div class="white-section">

      <!-- Current Pin -->
      <div class="field-group">
        <div class="field-label">Current Pin</div>
        <div class="field-input-wrap">
          <input type="password" class="field-input" placeholder="• • • •" maxlength="4" />
          <ion-icon name="eye-off-outline" class="field-eye"></ion-icon>
        </div>
      </div>

      <!-- New Pin -->
      <div class="field-group">
        <div class="field-label">New Pin</div>
        <div class="field-input-wrap">
          <input type="password" class="field-input" placeholder="• • • •" maxlength="4" />
          <ion-icon name="eye-off-outline" class="field-eye"></ion-icon>
        </div>
      </div>

      <!-- Confirm Pin -->
      <div class="field-group">
        <div class="field-label">Confirm Pin</div>
        <div class="field-input-wrap">
          <input type="password" class="field-input" placeholder="• • • •" maxlength="4" />
          <ion-icon name="eye-off-outline" class="field-eye"></ion-icon>
        </div>
      </div>

      <!-- Change Pin Button -->
      <div class="save-btn">Change Pin</div>

    </div>

  </div>
</ion-content>

<ion-footer class="floating-footer">
  <div class="nav-item">
    <ion-icon name="home-outline"></ion-icon>

  <div class="nav-item">
<ion-icon name="search-outline"></ion-icon>
  </div>

  </div>
  <div class="nav-item">
    <ion-icon name="layers-outline"></ion-icon>
  </div>
  <div class="nav-active-bg">
    <div class="nav-item">
      <ion-icon name="person-outline"></ion-icon>
    </div>
  </div>
</ion-footer>
