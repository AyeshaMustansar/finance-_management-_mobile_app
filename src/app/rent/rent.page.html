<ion-content class="rent-content">
  <div class="main-content">

    <!-- ===== GREEN TOP SECTION ===== -->
    <div class="top-section">
      <div class="navbar-row">
        <div class="nav-btn nav-btn--back">
          <ion-icon name="chevron-back-outline"></ion-icon>
        </div>
        <div class="nav-title">Rent</div>
        <div class="nav-btn nav-btn--bell">
          <ion-icon name="notifications-outline"></ion-icon>
        </div>
      </div>

      <!-- Stats Row -->
      <div class="stats-row">
        <div class="stat-item">
          <ion-icon name="arrow-up-outline" class="stat-icon"></ion-icon>
          <div class="stat-info">
            <div class="stat-label">Total Balance</div>
            <div class="stat-amount">$7,783.00</div>
          </div>
        </div>
        <div class="stats-divider"></div>
        <div class="stat-item">
          <ion-icon name="arrow-down-outline" class="stat-icon"></ion-icon>
          <div class="stat-info">
            <div class="stat-label">Total Expense</div>
            <div class="stat-amount stat-amount--dark">-$1,187.40</div>
          </div>
        </div>
      </div>

      <!-- Progress Bar -->
      <div class="progress-wrap">
        <div class="progress-bar-outer">
          <span class="progress-label">30%</span>
          <div class="progress-bar-inner">
            <span class="progress-amount">$20,000.00</span>
          </div>
        </div>
      </div>

      <!-- Note -->
      <div class="note-row">
        <ion-icon name="checkbox-outline" class="note-icon"></ion-icon>
        <span class="note-text">30% Of Your Expenses, Looks Good.</span>
      </div>
    </div>

    <!-- ===== WHITE SECTION ===== -->
    <div class="white-section">

      <!-- APRIL -->
      <div class="section-header">
        <div class="section-label">April</div>
        <div class="filter-btn">
          <ion-icon name="menu-outline"></ion-icon>
        </div>
      </div>

      <div class="txn-list">
        <div class="txn-item">
          <div class="txn-icon-wrap">
            <ion-icon name="home-outline"></ion-icon>
          </div>
          <div class="txn-info">
            <div class="txn-name">Rent</div>
            <div class="txn-date">18:27 - April 15</div>
          </div>
          <div class="txn-amount">-$874,40</div>
        </div>
      </div>

      <!-- MARCH -->
      <div class="section-label section-label--gap">March</div>
      <div class="txn-list">
        <div class="txn-item">
          <div class="txn-icon-wrap">
            <ion-icon name="home-outline"></ion-icon>
          </div>
          <div class="txn-info">
            <div class="txn-name">Rent</div>
            <div class="txn-date">11:00 - March 15</div>
          </div>
          <div class="txn-amount">-$674,40</div>
        </div>
      </div>

      <!-- FEBRUARY -->
      <div class="section-label section-label--gap">February</div>
      <div class="txn-list">
        <div class="txn-item">
          <div class="txn-icon-wrap">
            <ion-icon name="home-outline"></ion-icon>
          </div>
          <div class="txn-info">
            <div class="txn-name">Rent</div>
            <div class="txn-date">11:47 - February 15</div>
          </div>
          <div class="txn-amount">-$674,40</div>
        </div>
      </div>

      <!-- JANUARY -->
      <div class="section-label section-label--gap">January</div>
      <div class="txn-list">
        <div class="txn-item">
          <div class="txn-icon-wrap">
            <ion-icon name="home-outline"></ion-icon>
          </div>
          <div class="txn-info">
            <div class="txn-name">Rent</div>
            <div class="txn-date">18:50 - January 15</div>
          </div>
          <div class="txn-amount">-$674,40</div>
        </div>
      </div>

      <!-- Add Expenses Button -->
      <div class="add-btn">Add Expenses</div>

    </div>

  </div>
</ion-content>

<ion-footer class="floating-footer">
  <div class="nav-item">
    <ion-icon name="home-outline"></ion-icon>
  </div>
  <div class="nav-item">
    <ion-icon name="search-outline"></ion-icon>
  </div>
  <div class="nav-item">
    <ion-icon name="swap-horizontal-outline"></ion-icon>
  </div>
  <div class="nav-active-bg">
    <div class="nav-item">
      <ion-icon name="layers-outline"></ion-icon>
    </div>
  </div>
  <div class="nav-item">
    <ion-icon name="person-outline"></ion-icon>
  </div>
</ion-footer>
