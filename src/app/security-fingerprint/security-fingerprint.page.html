<ion-content [fullscreen]="true" [scrollY]="false" class="security-fingerprint-content">

  <!-- Green Top Section -->
  <div class="green-top">
    <h1 class="page-title">Security Fingerprint</h1>
  </div>

  <!-- White Bottom Sheet -->
  <div class="white-sheet">
    <div class="center-wrapper">

      <!-- Fingerprint Circle -->
      <div class="fingerprint-circle">
        <ion-icon name="finger-print-outline"></ion-icon>
      </div>

      <!-- Text -->
      <h2 class="fp-title">Use Fingerprint  To Access</h2>
      <p class="fp-desc">
        Lorem ipsum dolor sit amet, consectetur adipiscing
        elit, sed do eiusmod tempor incididunt.
      </p>

      <!-- Spacer -->
      <div class="spacer"></div>

      <!-- Use Touch ID Button -->
      <button class="touch-btn" type="button">Use Touch Id</button>

      <!-- Or prefer pin code -->
      <div class="pin-row">
        <button class="link-btn" type="button">Or prefer use pin code?</button>
      </div>

    </div>
  </div>

</ion-content>
