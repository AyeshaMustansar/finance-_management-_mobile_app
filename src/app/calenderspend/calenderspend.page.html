<ion-content class="calendar-content">
  <div class="main-content">

    <!-- GREEN TOP SECTION -->
    <div class="top-section">
      <div class="navbar-row">
        <div class="nav-btn nav-btn--back">
          <ion-icon name="chevron-back-outline"></ion-icon>
        </div>
        <div class="nav-title">Calender</div>
        <div class="nav-btn nav-btn--bell">
          <ion-icon name="notifications-outline"></ion-icon>
        </div>
      </div>
    </div>

    <!-- WHITE SECTION -->
    <div class="white-section">

      <!-- Month / Year Row -->
      <div class="cal-header">
        <div class="cal-dropdown">
          <span class="cal-dropdown-text">April</span>
          <ion-icon name="chevron-down-outline"></ion-icon>
        </div>
        <div class="cal-dropdown">
          <span class="cal-dropdown-text">2023</span>
          <ion-icon name="chevron-down-outline"></ion-icon>
        </div>
      </div>

      <!-- Days Header -->
      <div class="cal-days-header">
        <span>Mon</span>
        <span>Tue</span>
        <span>Wed</span>
        <span>Thu</span>
        <span>Fri</span>
        <span>Sat</span>
        <span>Sun</span>
      </div>

      <!-- Calendar Grid -->
      <div class="cal-grid">

        <!-- Row 1 -->
        <div class="cal-cell cal-cell--empty"></div>
        <div class="cal-cell cal-cell--empty"></div>
        <div class="cal-cell cal-cell--empty"></div>
        <div class="cal-cell cal-cell--empty"></div>
        <div class="cal-cell">1</div>
        <div class="cal-cell">2</div>
        <div class="cal-cell">3</div>

        <!-- Row 2 -->
        <div class="cal-cell">4</div>
        <div class="cal-cell">5</div>
        <div class="cal-cell">6</div>
        <div class="cal-cell">7</div>
        <div class="cal-cell">8</div>
        <div class="cal-cell">9</div>
        <div class="cal-cell">10</div>

        <!-- Row 3 -->
        <div class="cal-cell">11</div>
        <div class="cal-cell">12</div>
        <div class="cal-cell">13</div>
        <div class="cal-cell">14</div>
        <div class="cal-cell">15</div>
        <div class="cal-cell">16</div>
        <div class="cal-cell">17</div>

        <!-- Row 4 -->
        <div class="cal-cell">18</div>
        <div class="cal-cell">19</div>
        <div class="cal-cell">20</div>
        <div class="cal-cell">21</div>
        <div class="cal-cell">22</div>
        <div class="cal-cell">23</div>
        <div class="cal-cell">24</div>

        <!-- Row 5 -->
        <div class="cal-cell">25</div>
        <div class="cal-cell">26</div>
        <div class="cal-cell">27</div>
        <div class="cal-cell">28</div>
        <div class="cal-cell">29</div>
        <div class="cal-cell">30</div>
        <div class="cal-cell">31</div>

      </div>

      <!-- more content will go here -->

      <!-- Tab Bar -->
      <div class="tab-bar">
        <div class="tab-item tab-item--active">Spends</div>
        <div class="tab-item">Categories</div>
      </div>

      <!-- Transaction List -->
      <div class="txn-list">

        <!-- Groceries -->
        <div class="txn-item">
          <div class="txn-icon-wrap" style="background: #3299FF;">
            <ion-icon name="basket-outline"></ion-icon>
          </div>
          <div class="txn-info">
            <div class="txn-name">Groceries</div>
            <div class="txn-date">17:00 - April 24</div>
          </div>
          <div class="txn-right">
            <div class="txn-divider"></div>
            <div class="txn-tag">Pantry</div>
            <div class="txn-divider"></div>
            <div class="txn-amount txn-amount--red">-$100,00</div>
          </div>
        </div>

        <!-- Others -->
        <div class="txn-item">
          <div class="txn-icon-wrap" style="background: #6DB6FE;">
            <ion-icon name="cash-outline"></ion-icon>
          </div>
          <div class="txn-info">
            <div class="txn-name">Others</div>
            <div class="txn-date">17:00 - April 24</div>
          </div>
          <div class="txn-right">
            <div class="txn-divider"></div>
            <div class="txn-tag">Payments</div>
            <div class="txn-divider"></div>
            <div class="txn-amount txn-amount--dark">$120,00</div>
          </div>
        </div>

      </div>

    </div>

  </div>
</ion-content>






<ion-footer class="floating-footer">
  <div class="nav-item ">

      <ion-icon name="home-outline"></ion-icon>
    </div>

  <div class="nav-item nav-item--active ">
        <div class="nav-active-bg">
<ion-icon name="search-outline"></ion-icon>
  </div>

    <ion-icon name="swap-horizontal-outline"></ion-icon>
  </div>
  <div class="nav-item">
    <ion-icon name="layers-outline"></ion-icon>
  </div>
  <div class="nav-item">
    <ion-icon name="person-outline"></ion-icon>
  </div>
</ion-footer>
