<ion-content [fullscreen]="true" [scrollY]="false" class="forgot-password-content">

  <!-- Green Top Section -->
  <div class="green-top">
    <h1 class="page-title">Forgot Password</h1>
  </div>

  <!-- White Bottom Sheet -->
  <div class="white-sheet">

    <!-- Reset Heading & Description -->
    <div class="reset-section">
      <h2 class="reset-title">Reset Password?</h2>
      <p class="reset-desc">
        Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do
        eiusmod tempor incididunt ut labore ut dolore magna aliqua.
      </p>
    </div>

    <!-- Email Input -->
    <div class="input-group">
      <label class="input-label">Enter Email Address</label>
      <div class="input-wrapper">
        <ion-input
          type="email"
          placeholder="example@example.com"
          class="custom-input">
        </ion-input>
      </div>
    </div>

    <!-- Next Step Button -->
    <button class="next-btn" type="button" (click)="goTonewpassword()">Next Step</button>

    <!-- Divider -->
    <div class="divider-section">
      <div class="divider-line"></div>
    </div>

    <!-- Sign Up Button -->
    <button class="signup-btn" type="button" (click)="goTocreateaccount()">Sign Up</button>

    <!-- Or Sign Up With -->
    <p class="or-text">or sign up with</p>

    <!-- Social Buttons -->
    <div class="social-row">
      <button class="social-btn" type="button">
        <ion-icon name="logo-facebook"></ion-icon>
      </button>
      <button class="social-btn" type="button">
        <ion-icon name="logo-google"></ion-icon>
      </button>
    </div>

    <!-- Don't have account -->
    <div class="bottom-row">
      <span class="bottom-text">Don't have an account?</span>
      <button class="link-btn" type="button" (click)="goTocreateaccount()">Sign Up</button>
    </div>

  </div>

</ion-content>
