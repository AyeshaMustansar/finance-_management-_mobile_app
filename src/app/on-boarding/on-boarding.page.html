<ion-content [fullscreen]="true" [scrollY]="false" class="onboarding-content">

  <!-- Green Top Section -->
  <div class="green-top">
    <h1 class="page-title">Welcome To<br>Expense Manager</h1>
  </div>

  <!-- White Bottom Sheet -->
  <div class="white-sheet">
    <div class="center-wrapper">

      <!-- Coin Image with Circle -->
      <div class="image-section">
        <div class="circle-bg">
          <img src="../../assets/hand.png" alt="Coins" class="coins-img" />
        </div>
      </div>

      <!-- Spacer -->
      <div class="spacer"></div>

      <!-- Footer -->
      <div class="footer-section">
        <h2 class="next-text">Next</h2>
        <div class="dots">
          <span class="dot dot-active"></span>
          <span class="dot dot-inactive"></span>
        </div>
      </div>

    </div>
  </div>

</ion-content>
