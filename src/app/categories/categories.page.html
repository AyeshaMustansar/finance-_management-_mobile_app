<ion-content class="categories-content">
  <div class="main-content">

    <!-- GREEN TOP SECTION -->
    <div class="top-section">

      <!-- Navbar -->
      <div class="navbar-row">
        <div class="nav-btn nav-btn--back">
          <ion-icon name="chevron-back-outline"></ion-icon>
        </div>
        <div class="nav-title">Categories</div>
        <div class="nav-btn nav-btn--bell">
          <ion-icon name="notifications-outline"></ion-icon>
        </div>
      </div>

      <!-- Stats Row -->
      <div class="stats-row">
        <div class="stat-item">
          <ion-icon name="arrow-up-outline" class="stat-icon"></ion-icon>
          <div class="stat-info">
            <div class="stat-label">Total Balance</div>
            <div class="stat-amount">$7,783.00</div>
          </div>
        </div>
        <div class="stats-divider"></div>
        <div class="stat-item">
          <ion-icon name="arrow-down-outline" class="stat-icon"></ion-icon>
          <div class="stat-info">
            <div class="stat-label">Total Expense</div>
            <div class="stat-amount stat-amount--dark">-$1,187.40</div>
          </div>
        </div>
      </div>

      <!-- Progress Bar -->
      <div class="progress-wrap">
        <div class="progress-bar-outer">
          <span class="progress-label">30%</span>
          <div class="progress-bar-inner">
            <span class="progress-amount">$20,000.00</span>
          </div>
        </div>
      </div>

      <!-- Note -->
      <div class="note-row">
        <ion-icon name="checkbox-outline" class="note-icon"></ion-icon>
        <span class="note-text">30% Of Your Expenses, Looks Good.</span>
      </div>

    </div>
    <!-- END GREEN SECTION -->

    <!-- WHITE SECTION -->
    <div class="white-section">

      <!-- Categories Grid -->
      <div class="cat-grid">

        <div class="cat-card">
          <div class="cat-icon-wrap cat-icon-wrap--active">
            <ion-icon name="restaurant-outline"></ion-icon>
          </div>
          <div class="cat-label">Food</div>
        </div>

        <div class="cat-card">
          <div class="cat-icon-wrap">
            <ion-icon name="bus-outline"></ion-icon>
          </div>
          <div class="cat-label">Transport</div>
        </div>

        <div class="cat-card">
          <div class="cat-icon-wrap">
            <ion-icon name="medkit-outline"></ion-icon>
          </div>
          <div class="cat-label">Medicine</div>
        </div>

        <div class="cat-card">
          <div class="cat-icon-wrap">
            <ion-icon name="basket-outline"></ion-icon>
          </div>
          <div class="cat-label">Groceries</div>
        </div>

        <div class="cat-card">
          <div class="cat-icon-wrap">
            <ion-icon name="home-outline"></ion-icon>
          </div>
          <div class="cat-label">Rent</div>
        </div>

        <div class="cat-card">
          <div class="cat-icon-wrap">
            <ion-icon name="gift-outline"></ion-icon>
          </div>
          <div class="cat-label">Gifts</div>
        </div>

        <div class="cat-card">
          <div class="cat-icon-wrap">
            <ion-icon name="wallet-outline"></ion-icon>
          </div>
          <div class="cat-label">Savings</div>
        </div>

        <div class="cat-card">
          <div class="cat-icon-wrap">
            <ion-icon name="ticket-outline"></ion-icon>
          </div>
          <div class="cat-label">Entertainment</div>
        </div>

        <div class="cat-card">
          <div class="cat-icon-wrap">
            <ion-icon name="add-outline"></ion-icon>
          </div>
          <div class="cat-label">More</div>
        </div>

      </div>

    </div>
    <!-- END WHITE SECTION -->

  </div>
</ion-content>




<ion-footer class="floating-footer">
  <div class="nav-item nav-item--active">
   
      <ion-icon name="home-outline"></ion-icon>
  
  </div>
  <div class="nav-item">
    <ion-icon name="search-outline"></ion-icon>
  </div>
   <div class="nav-active-bg">
  <div class="nav-item">
    <ion-icon name="swap-horizontal-outline"></ion-icon>
  </div>
  </div>
  <div class="nav-item">
    <ion-icon name="layers-outline"></ion-icon>
  </div>
  <div class="nav-item">
    <ion-icon name="person-outline"></ion-icon>
  </div>
</ion-footer>
