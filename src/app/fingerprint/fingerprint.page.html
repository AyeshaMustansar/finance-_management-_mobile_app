<ion-content class="fingerprint-content">
  <div class="main-content">

    <!-- ===== GREEN TOP SECTION ===== -->
    <div class="top-section">
      <div class="navbar-row">
        <div class="nav-btn nav-btn--back" (click)="goTosecurity()" >
          <ion-icon name="chevron-back-outline"></ion-icon>
        </div>
        <div class="nav-title"   >Fingerprint</div>
        <div class="nav-btn nav-btn--bell"     (click)="goTonotification()" >
          <ion-icon name="notifications-outline"    (click)="goTonotification()"></ion-icon>
        </div>
      </div>
    </div>

    <!-- ===== WHITE SECTION ===== -->
    <div class="white-section">

      <!-- John Fingerprint -->
      <div class="menu-item">
        <div class="menu-icon-wrap">
          <ion-icon name="finger-print-outline"  (click)="goTojhonfingerprint()"    ></ion-icon>
        </div>
        <span class="menu-label"  (click)="goTojhonfingerprint()"  >John Fingerprint</span>
        <ion-icon name="chevron-forward-outline" class="menu-arrow"  (click)="goTojhonfingerprint()"  ></ion-icon>
      </div>

      <!-- Add A Fingerprint -->
      <div class="menu-item"  (click)="goToaddfingerprint()">
        <div class="menu-icon-wrap add">
          <ion-icon name="add-outline"   (click)="goToaddfingerprint()" ></ion-icon>
        </div>
        <span class="menu-label"   (click)="goToaddfingerprint()" >Add A Fingerprint</span>
        <ion-icon name="chevron-forward-outline" class="menu-arrow"   (click)="goToaddfingerprint()"  ></ion-icon>
      </div>

    </div>

  </div>
</ion-content>

<ion-footer class="floating-footer">
  <div class="nav-item">
    <ion-icon    name="home-outline"
                                       (click)="goTobottomnavigation()">     </ion-icon>
  </div>
  <div class="nav-item">
    <ion-icon name="search-outline"               (click)="goTodaily()"            ></ion-icon>
  </div>
  <div class="nav-item">
    <ion-icon name="swap-horizontal-outline" (click)="goTotransaction()"  ></ion-icon>
  </div>

    <div class="nav-item">
      <ion-icon name="layers-outline"   (click)="goTocategories()"    ></ion-icon>

  </div>
    <div class="nav-active-bg">
  <div class="nav-item nav-item--active">
   
    <ion-icon name="person-outline"></ion-icon>
     </div>
  </div>
</ion-footer>
