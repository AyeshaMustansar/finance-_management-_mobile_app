<ion-content class="notif-settings-content">
  <div class="main-content">

    <!-- GREEN TOP SECTION -->
    <div class="top-section">
      <div class="navbar-row">
        <div class="nav-btn nav-btn--back">
          <ion-icon name="chevron-back-outline"></ion-icon>
        </div>
        <div class="nav-title">Notification Settings</div>
        <div class="nav-btn nav-btn--bell">
          <ion-icon name="notifications-outline"></ion-icon>
        </div>
      </div>
    </div>

    <!-- WHITE SECTION -->
    <div class="white-section">
      <div class="settings-container">

        <div class="toggle-item">
          <span class="toggle-label">General Notification</span>
          <div class="toggle-wrap toggle-wrap--on">
            <div class="toggle-dot"></div>
          </div>
        </div>

        <div class="toggle-item">
          <span class="toggle-label">Sound</span>
          <div class="toggle-wrap toggle-wrap--on">
            <div class="toggle-dot"></div>
          </div>
        </div>

        <div class="toggle-item">
          <span class="toggle-label">Sound Call</span>
          <div class="toggle-wrap toggle-wrap--on">
            <div class="toggle-dot"></div>
          </div>
        </div>

        <div class="toggle-item">
          <span class="toggle-label">Vibrate</span>
          <div class="toggle-wrap toggle-wrap--on">
            <div class="toggle-dot"></div>
          </div>
        </div>

        <div class="toggle-item">
          <span class="toggle-label">Transaction Update</span>
          <div class="toggle-wrap toggle-wrap--on">
            <div class="toggle-dot"></div>
          </div>
        </div>

        <div class="toggle-item">
          <span class="toggle-label">Expense Reminder</span>
          <div class="toggle-wrap toggle-wrap--on">
            <div class="toggle-dot"></div>
          </div>
        </div>

        <div class="toggle-item">
          <span class="toggle-label">Budget Notifications</span>
          <div class="toggle-wrap toggle-wrap--on">
            <div class="toggle-dot"></div>
          </div>
        </div>

        <div class="toggle-item">
          <span class="toggle-label">Low Balance Alerts</span>
          <div class="toggle-wrap toggle-wrap--on">
            <div class="toggle-dot"></div>
          </div>
        </div>

      </div>
    </div>

  </div>
</ion-content>












<ion-footer class="floating-footer">
  <div class="nav-item">
    <ion-icon name="home-outline"></ion-icon>
  </div>
  <div class="nav-item">
    <ion-icon name="search-outline"></ion-icon>
  </div>
  <div class="nav-item">
    <ion-icon name="swap-horizontal-outline"></ion-icon>
  </div>
  <div class="nav-active-bg">
    <div class="nav-item">
      <ion-icon name="layers-outline"></ion-icon>
    </div>
  </div>
  <div class="nav-item nav-item--active">
    <ion-icon name="person-outline"></ion-icon>
  </div>
</ion-footer>
