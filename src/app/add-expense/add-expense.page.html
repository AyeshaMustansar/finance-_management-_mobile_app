<ion-content class="add-expenses-content">
  <div class="main-content">

    <!-- GREEN TOP SECTION -->
    <div class="top-section">
      <div class="navbar-row">
        <div class="nav-btn nav-btn--back">
          <ion-icon name="chevron-back-outline"></ion-icon>
        </div>
        <div class="nav-title">Add Expenses</div>
        <div class="nav-btn nav-btn--bell">
          <ion-icon name="notifications-outline"></ion-icon>
        </div>
      </div>
    </div>

    <!-- WHITE SECTION -->
    <div class="white-section">
      <div class="form-container">

        <!-- Date -->
        <div class="field-group">
          <div class="field-label">Date</div>
          <div class="input-wrap">
            <input type="text" class="field-input" placeholder="April 30, 2024" />
            <div class="field-toggle">
              <ion-icon name="ellipse" class="toggle-dot"></ion-icon>
            </div>
          </div>
        </div>

        <!-- Category -->
        <div class="field-group">
          <div class="field-label">Category</div>
          <div class="input-wrap">
            <input type="text" class="field-input" placeholder="Select the category" />
            <ion-icon name="chevron-down-outline" class="field-icon"></ion-icon>
          </div>
        </div>

        <!-- Amount -->
        <div class="field-group">
          <div class="field-label">Amount</div>
          <input type="text" class="field-input field-input--solo" placeholder="$0.00" />
        </div>

        <!-- Expense Title -->
        <div class="field-group">
          <div class="field-label">Expense Title</div>
          <input type="text" class="field-input field-input--solo" placeholder="Enter title" />
        </div>

        <!-- Enter Message -->
        <div class="field-group">
          <div class="field-label">Message</div>
          <textarea class="field-textarea" placeholder="Enter Message"></textarea>
        </div>

        <!-- Save Button -->
        <div class="save-btn">Save</div>

      </div>
    </div>

  </div>
</ion-content>
