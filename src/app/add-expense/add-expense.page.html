<ion-content class="add-expenses-content">
  <div class="main-content">

    <div class="top-section">
      <div class="navbar-row">
        <div class="nav-btn nav-btn--back">
          <ion-icon name="chevron-back-outline"></ion-icon>
        </div>
        <div class="nav-title">Add Expenses</div>
        <div class="nav-btn nav-btn--bell">
          <ion-icon name="notifications-outline"></ion-icon>
        </div>
      </div>
    </div>

    <div class="white-section">
      <div class="form-container">

     
        <div class="field-group">
          <div class="field-label">Date</div>
          <div class="field-input">
            <span class="field-value">April 30 ,2024</span>
            <div class="field-toggle">
              <ion-icon name="ellipse" class="toggle-dot"></ion-icon>
            </div>
          </div>
        </div>

      
        <div class="field-group">
          <div class="field-label">Category</div>
          <div class="field-input">
            <span class="field-placeholder">Select the category</span>
            <ion-icon name="chevron-down-outline" class="field-icon"></ion-icon>
          </div>
        </div>

                <div class="field-group">
          <div class="field-label">Amount</div>
          <div class="field-input">
            <span class="field-value">$26,00</span>
          </div>
        </div>

  
        <div class="field-group">
          <div class="field-label">Expense Title</div>
          <div class="field-input">
            <span class="field-value">Dinner</span>
          </div>
        </div>

       
        <div class="field-group">
          <div class="field-textarea">
            <span class="field-placeholder">Enter Message</span>
          </div>
        </div>

     
        <div class="save-btn">Save</div>

      </div>
    </div>

  </div>
</ion-content>
