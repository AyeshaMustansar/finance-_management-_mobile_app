<ion-content  class="transaction2-content">
  <div class="main-content">

    <!-- GREEN TOP SECTION -->
    <div class="top-section">

      <!-- Navbar -->
      <div class="navbar-row">
        <div class="nav-btn nav-btn--back">
          <ion-icon name="chevron-back-outline"></ion-icon>
        </div>
        <div class="nav-title">Transaction</div>
        <div class="nav-btn nav-btn--bell">
          <ion-icon name="notifications-outline"></ion-icon>
        </div>
      </div>

      <!-- Total Balance Card -->
      <div class="balance-card">
        <div class="balance-card__label">Total Balance</div>
        <div class="balance-card__amount">$7,783.00</div>
      </div>

      <!-- Income / Expense Cards -->
      <div class="ie-row">

        <div class="ie-card">
          <div class="ie-icon-wrap ie-icon--teal">
            <ion-icon name="arrow-up-outline"></ion-icon>
          </div>
          <div class="ie-label">Income</div>
          <div class="ie-amount">$4,120.00</div>
        </div>

        <div class="ie-card">
          <div class="ie-icon-wrap ie-icon--blue">
            <ion-icon name="arrow-down-outline"></ion-icon>
          </div>
          <div class="ie-label">Expense</div>
          <div class="ie-amount">$1,187.40</div>
        </div>

      </div>

    </div>
    <!-- END GREEN SECTION -->

    <!-- WHITE BOTTOM SECTION -->
    <div class="white-section">

      <!-- Month Header -->
      <div class="month-header">
        <span class="month-title">April</span>
        <div class="month-dot"></div>
      </div>

      <!-- Salary -->
      <div class="transaction-card">
        <div class="trans-icon-wrap green">
          <ion-icon name="cash-outline"></ion-icon>
        </div>
        <div class="trans-details">
          <span class="trans-name">Salary</span>
          <span class="trans-sub">8:00 - April 30 &nbsp;|&nbsp; Monthly</span>
        </div>
        <div class="trans-right">
          <span class="trans-amount positive">+$4,099.00</span>
          <span class="trans-tag">Family</span>
        </div>
      </div>

      <!-- Groceries -->
      <div class="transaction-card">
        <div class="trans-icon-wrap blue">
          <ion-icon name="basket-outline"></ion-icon>
        </div>
        <div class="trans-details">
          <span class="trans-name">Groceries</span>
          <span class="trans-sub">8:00 - April 24</span>
        </div>
        <div class="trans-right">
          <span class="trans-amount negative">-$100.00</span>
          <span class="trans-tag">Family</span>
        </div>
      </div>

      <!-- Rent -->
      <div class="transaction-card">
        <div class="trans-icon-wrap orange"> 
          <ion-icon name="home-outline"></ion-icon>
        </div>
        <div class="trans-details">
          <span class="trans-name">Rent</span>
          <span class="trans-sub">8:00 - April 15 &nbsp;|&nbsp; Item</span>
        </div>
        <div class="trans-right">
          <span class="trans-amount negative">-$974.40</span>
          <span class="trans-tag">Item</span>
        </div>
      </div>

      <!-- Transport -->
      <div class="transaction-card">
        <div class="trans-icon-wrap purple">
          <ion-icon name="car-outline"></ion-icon>
        </div>
        <div class="trans-details">
          <span class="trans-name">Transport</span>
          <span class="trans-sub">7:00 - April 10</span>
        </div>
        <div class="trans-right">
          <span class="trans-amount negative">-$8.00</span>
          <span class="trans-tag">Fuel</span>
        </div>
      </div>

      <!-- Food -->
      <div class="transaction-card">
        <div class="trans-icon-wrap pink">
          <ion-icon name="fast-food-outline"></ion-icon>
        </div>
        <div class="trans-details">
          <span class="trans-name">Food</span>
          <span class="trans-sub">10:30 - March 31</span>
        </div>
        <div class="trans-right">
          <span class="trans-amount negative">-$70.40</span>
          <span class="trans-tag">Dine</span>
        </div>
      </div>

    </div>
    <!-- END WHITE SECTION -->

  </div>
</ion-content>

<ion-footer class="floating-footer">
  <div class="nav-item nav-item--active">
   
      <ion-icon name="home-outline"></ion-icon>
  
  </div>
  <div class="nav-item">
    <ion-icon name="search-outline"></ion-icon>
  </div>
   <div class="nav-active-bg">
  <div class="nav-item">
    <ion-icon name="swap-horizontal-outline"></ion-icon>
  </div>
  </div>
  <div class="nav-item">
    <ion-icon name="layers-outline"></ion-icon>
  </div>
  <div class="nav-item">
    <ion-icon name="person-outline"></ion-icon>
  </div>
</ion-footer>
