<ion-content class="support-content">
  <div class="main-content">

    <!-- TOP TEAL SECTION -->
    <div class="top-section">
      <div class="navbar-row">
        <div class="back-btn">
          <ion-icon name="chevron-back-outline"></ion-icon>
        </div>
        <span class="page-title">Online Support</span>
        <div class="nav-btn nav-btn--bell">
          <ion-icon name="notifications-outline"></ion-icon>
        </div>
      </div>
    </div>

    <!-- WHITE SECTION -->
    <div class="white-section">

      <!-- Active Chats -->
      <div class="section-title">Active Chats</div>

      <div class="chat-list">
        <div class="chat-item">
          <div class="chat-avatar">
            <ion-icon name="headset-outline"></ion-icon>
          </div>
          <div class="chat-info">
            <div class="chat-name">Support Assistant</div>
            <div class="chat-msg">Hello! I'm here to assist you.</div>
          </div>
          <div class="chat-meta">
            <div class="chat-time">3 Min Ago</div>
          </div>
        </div>
      </div>

      <!-- Ended Chats -->
      <div class="section-title section-title--gap">Ended Chats</div>

      <div class="chat-list">

        <div class="chat-item">
          <div class="chat-avatar chat-avatar--ended">
            <ion-icon name="help-circle-outline"></ion-icon>
          </div>
          <div class="chat-info">
            <div class="chat-name">Help Center</div>
            <div class="chat-msg">Your account is ready to use...</div>
          </div>
          <div class="chat-meta">
            <div class="chat-time chat-time--ended">Feb 06 · 2024</div>
          </div>
        </div>

        <div class="chat-item">
          <div class="chat-avatar chat-avatar--ended">
            <ion-icon name="headset-outline"></ion-icon>
          </div>
          <div class="chat-info">
            <div class="chat-name">Support Assistant</div>
            <div class="chat-msg">Hello! I'm here to assist you.</div>
          </div>
          <div class="chat-meta">
            <div class="chat-time chat-time--ended">Sep 10 · 2023</div>
          </div>
        </div>

        <div class="chat-item">
          <div class="chat-avatar chat-avatar--ended">
            <ion-icon name="help-circle-outline"></ion-icon>
          </div>
          <div class="chat-info">
            <div class="chat-name">Help Center</div>
            <div class="chat-msg">Hi, how are you today?</div>
          </div>
          <div class="chat-meta">
            <div class="chat-time chat-time--ended">June 13 · 2022</div>
          </div>
        </div>

      </div>

      <!-- Start Another Chat Button -->
      <div class="add-btn-wrap">
        <ion-button expand="block" class="add-btn">Start Another Chat</ion-button>
      </div>

    </div>
    <!-- END WHITE SECTION -->

  </div>
</ion-content>
