<ion-content class="travel-content">
  <div class="main-content">

    <!-- TOP TEAL SECTION -->
    <div class="top-section">

      <!-- Navbar -->
      <div class="navbar-row">
        <div class="back-btn">
          <ion-icon name="chevron-back-outline"></ion-icon>
        </div>
        <div class="nav-btn nav-btn--bell">
          <ion-icon name="notifications-outline"></ion-icon>
        </div>
      </div>

    </div>
    <!-- END TOP SECTION -->

    <!-- WHITE SECTION -->
    <div class="white-section">

      <!-- Hero Row: Stats + Circle -->
      <div class="hero-row">

        <!-- Stats -->
        <div class="stats-col">
          <div class="stat-item">
            <div class="stat-label">
              <ion-icon name="flag-outline"></ion-icon>
              Goal
            </div>
            <div class="stat-amount">$1,962.93</div>
          </div>
          <div class="stat-item">
            <div class="stat-label">
              <ion-icon name="wallet-outline"></ion-icon>
              Amount Saved
            </div>
            <div class="stat-amount">$653.31</div>
          </div>
        </div>

        <!-- Circle Card -->
        <div class="circle-card">
          <div class="circle-outer">
            <svg width="96" height="96" viewBox="0 0 96 96" fill="none" xmlns="http://www.w3.org/2000/svg" class="circle-svg">
              <circle cx="47.9924" cy="47.9923" r="46.3594" transform="rotate(-87.7272 47.9924 47.9923)" stroke="#F1FFF3" stroke-width="3.26474" stroke-linejoin="round"/>
            </svg>
            <svg width="53" height="98" viewBox="0 0 53 98" fill="none" xmlns="http://www.w3.org/2000/svg" class="circle-svg-blue">
              <path d="M5.98826 2.28579C31.5717 3.30117 51.4822 25.0098 50.4597 50.7734C49.4371 76.537 27.8688 96.5994 2.28534 95.584" stroke="#0068FF" stroke-width="4.57064" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <div class="circle-inner">
              <ion-icon name="airplane-outline"></ion-icon>
            </div>
          </div>
          <div class="circle-label">Travel</div>
        </div>

      </div>

      <!-- Progress Bar -->
      <div class="progress-wrap">
        <div class="progress-bar-outer">
          <span class="progress-label">40%</span>
          <div class="progress-bar-inner">
            <span class="progress-amount">$1,962.93</span>
          </div>
        </div>
      </div>

      <!-- Note Row -->
      <div class="note-row">
        <ion-icon name="checkbox-outline" class="note-icon"></ion-icon>
        <span class="note-text">30% Of Your Expenses, Looks Good.</span>
      </div>

      <!-- Month Row -->
      <div class="month-row">
        <span class="month-title">April</span>
        <div class="menu-btn">
          <ion-icon name="menu-outline"></ion-icon>
        </div>
      </div>

      <!-- Transaction List -->
      <div class="txn-list">

        <div class="txn-item">
          <div class="txn-icon-wrap">
            <ion-icon name="airplane-outline"></ion-icon>
          </div>
          <div class="txn-info">
            <div class="txn-name">Travel Deposit</div>
            <div class="txn-date">19:56 · April 30</div>
          </div>
          <div class="txn-amount">$217.77</div>
        </div>
        <div class="txn-item">
          <div class="txn-icon-wrap">
            <ion-icon name="airplane-outline"></ion-icon>
          </div>
          <div class="txn-info">
            <div class="txn-name">Travel Deposit</div>
            <div class="txn-date">17:42 · April 14</div>
          </div>
          <div class="txn-amount">$217.77</div>
        </div>

        <div class="txn-item">
          <div class="txn-icon-wrap">
            <ion-icon name="airplane-outline"></ion-icon>
          </div>
          <div class="txn-info">
            <div class="txn-name">Travel Deposit</div>
            <div class="txn-date">12:30 · April 02</div>
          </div>
          <div class="txn-amount">$217.77</div>
        </div>

      </div>

      <!-- Add Savings Button -->
      <div class="add-btn-wrap">
        <ion-button expand="block" class="add-btn" (click)="goToaddsavings()">Add Savings</ion-button>
      </div>

    </div>
    <!-- END WHITE SECTION -->

  </div>
</ion-content>



<ion-footer class="floating-footer">
  <div class="nav-item">
    <ion-icon name="home-outline"(click)="goTobottomnavigation()"></ion-icon>
  </div>
  <div class="nav-item">
    <ion-icon name="search-outline"(click)="goTodaily()"></ion-icon>
  </div>
  <div class="nav-item">
    <ion-icon name="swap-horizontal-outline"(click)="goTotransaction()"></ion-icon>
  </div>
  <div class="nav-active-bg">
    <div class="nav-item">
      <ion-icon name="layers-outline"></ion-icon>
    </div>
  </div>
  <div class="nav-item">
    <ion-icon name="person-outline" (click)="goToprofile()"></ion-icon>
  </div>
</ion-footer>
