<ion-content class="travel-content">
  <div class="main-content">

    <!-- ===== GREEN TOP SECTION ===== -->
    <div class="top-section">

      <!-- Navbar -->
      <div class="navbar-row">
        <div class="nav-btn nav-btn--back">
          <ion-icon name="chevron-back-outline"></ion-icon>
        </div>
        <div class="nav-title">Travel</div>
        <div class="nav-btn nav-btn--bell">
          <ion-icon name="notifications-outline"></ion-icon>
        </div>
      </div>

      <!-- Hero Row: Stats Left + Circle Right -->
      <div class="hero-row">

        <!-- Left: Goal & Amount Saved -->
        <div class="hero-stats">

          <div class="hero-stat-item">
            <div class="hero-stat-label">
              <ion-icon name="radio-button-on-outline" class="label-icon"></ion-icon>
              <span>Goal</span>
            </div>
            <div class="hero-stat-amount">$1,962.93</div>
          </div>

          <div class="hero-stat-item">
            <div class="hero-stat-label">
              <ion-icon name="checkbox-outline" class="label-icon"></ion-icon>
              <span>Amount Saved</span>
            </div>
            <div class="hero-stat-amount hero-stat-amount--blue">$653.31</div>
          </div>

        </div>

        <!-- Right: Circle with Arc + Icon -->
        <div class="circle-wrap">

          <!-- Outer light circle -->
          <svg class="circle-bg" width="69" height="69" viewBox="0 0 69 69" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="34.1723" cy="34.1722" r="33.0095" transform="rotate(-87.7272 34.1723 34.1722)" stroke="#F1FFF3" stroke-width="2.32461" stroke-linejoin="round"/>
          </svg>

          <!-- Blue arc overlay -->
          <svg class="circle-arc" width="38" height="70" viewBox="0 0 38 70" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M4.26387 1.62746C22.4802 2.35044 36.6572 17.8078 35.9291 36.1524C35.201 54.4969 19.8436 68.7821 1.62726 68.0591" stroke="#0068FF" stroke-width="3.25446" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>

          <!-- Blue circle background with plane icon -->
          <div class="circle-inner">
            <ion-icon name="airplane-outline" class="circle-icon"></ion-icon>
            <span class="circle-label">Travel</span>
          </div>

        </div>

      </div>

    </div>
    <!-- END GREEN SECTION -->

  </div>
</ion-content>
